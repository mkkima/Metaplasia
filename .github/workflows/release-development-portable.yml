name: Release development portable build

on:
  push:
    tags:
      - "dev-v*"

permissions:
  contents: write

concurrency:
  group: development-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, test, and publish development portable
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate development tag and project versions
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^dev-v(?<version>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))$') {
            throw 'Development release tags must use dev-vMAJOR.MINOR.PATCH.'
          }
          $version = $Matches.version
          $cmake = Get-Content -Raw 'CMakeLists.txt'
          if ($cmake -notmatch 'project\(Metaplasia VERSION (?<version>[0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Could not read the CMake project version.'
          }
          $cmakeVersion = $Matches.version
          $cargoLine = Select-String -Path 'src-tauri/Cargo.toml' -Pattern '^version = "([0-9]+\.[0-9]+\.[0-9]+)"$' | Select-Object -First 1
          if (-not $cargoLine) { throw 'Could not read the Cargo package version.' }
          $cargoVersion = $cargoLine.Matches[0].Groups[1].Value
          $tauriVersion = (Get-Content -Raw 'src-tauri/tauri.conf.json' | ConvertFrom-Json).version
          foreach ($candidate in @($cmakeVersion, $cargoVersion, $tauriVersion)) {
            if ($candidate -ne $version) {
              throw "Tag $tag does not match every project version (CMake=$cmakeVersion, Cargo=$cargoVersion, Tauri=$tauriVersion)."
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Configure, build, and test Debug portable application
        shell: pwsh
        env:
          METAPLASIA_UPDATE_CHANNEL: development
          METAPLASIA_UPDATE_PUBLIC_KEY: ${{ secrets.METAPLASIA_DEVELOPMENT_UPDATE_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:METAPLASIA_UPDATE_PUBLIC_KEY)) {
            throw 'Required GitHub Actions secret METAPLASIA_DEVELOPMENT_UPDATE_PUBLIC_KEY is not configured.'
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw 'vswhere.exe was not found on the GitHub runner.'
          }
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'A supported MSVC toolchain was not found.' }
          $devShell = Join-Path $installation 'Common7\Tools\Launch-VsDevShell.ps1'
          if (-not (Test-Path -LiteralPath $devShell -PathType Leaf)) {
            throw 'The Visual Studio developer shell was not found.'
          }
          & $devShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake --preset windows-msvc-debug
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed.' }
          cmake --build --preset windows-msvc-debug
          if ($LASTEXITCODE -ne 0) { throw 'Debug build failed.' }
          ctest --preset windows-msvc-debug
          if ($LASTEXITCODE -ne 0) { throw 'Debug tests failed.' }

      - name: Materialize and validate development update signing key
        id: tools
        shell: pwsh
        env:
          METAPLASIA_DEVELOPMENT_UPDATE_PUBLIC_KEY: ${{ secrets.METAPLASIA_DEVELOPMENT_UPDATE_PUBLIC_KEY }}
          METAPLASIA_DEVELOPMENT_UPDATE_PRIVATE_KEY_PEM_B64: ${{ secrets.METAPLASIA_DEVELOPMENT_UPDATE_PRIVATE_KEY_PEM_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @(
            'METAPLASIA_DEVELOPMENT_UPDATE_PUBLIC_KEY',
            'METAPLASIA_DEVELOPMENT_UPDATE_PRIVATE_KEY_PEM_B64'
          )) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "Required GitHub Actions secret $name is not configured."
            }
          }

          $privateKey = Join-Path $env:RUNNER_TEMP 'metaplasia-development-update-private.pem'
          [IO.File]::WriteAllBytes(
            $privateKey,
            [Convert]::FromBase64String($env:METAPLASIA_DEVELOPMENT_UPDATE_PRIVATE_KEY_PEM_B64)
          )
          $openssl = (Get-Command openssl -ErrorAction SilentlyContinue).Source
          if (-not $openssl) {
            $openssl = 'C:\Program Files\Git\usr\bin\openssl.exe'
          }
          if (-not (Test-Path -LiteralPath $openssl -PathType Leaf)) {
            throw 'OpenSSL was not found on the GitHub runner.'
          }
          $publicDer = Join-Path $env:RUNNER_TEMP 'metaplasia-development-update-public.der'
          & $openssl pkey -in $privateKey -pubout -outform DER -out $publicDer
          if ($LASTEXITCODE -ne 0) { throw 'The development update private key is invalid.' }
          $publicBytes = [IO.File]::ReadAllBytes($publicDer)
          if ($publicBytes.Length -lt 32) { throw 'The derived development public key is invalid.' }
          $rawPublic = $publicBytes[($publicBytes.Length - 32)..($publicBytes.Length - 1)]
          $derivedPublic = [Convert]::ToBase64String($rawPublic)
          if ($derivedPublic -cne $env:METAPLASIA_DEVELOPMENT_UPDATE_PUBLIC_KEY.Trim()) {
            throw 'The development update public key does not match the private key.'
          }
          "private_key=$privateKey" >> $env:GITHUB_OUTPUT
          "public_der=$publicDer" >> $env:GITHUB_OUTPUT
          "openssl=$openssl" >> $env:GITHUB_OUTPUT

      - name: Create and sign development portable update assets
        id: assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $output = Join-Path $PWD 'release-assets'
          $payload = Join-Path $env:RUNNER_TEMP 'metaplasia-development-portable'
          New-Item -ItemType Directory -Path $output, $payload | Out-Null
          $names = @(
            'metaplasia.exe',
            'metaplasia-host.exe',
            'metaplasia-watchdog.exe',
            'metaplasia-cli.exe',
            'metaplasia-agent.dll'
          )
          foreach ($name in $names) {
            $source = Join-Path 'build/debug/bin' $name
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Missing development component: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $payload $name)
          }
          $zipName = "Metaplasia-$version-windows-x64-portable-dev.zip"
          $zip = Join-Path $output $zipName
          Compress-Archive -LiteralPath ($names | ForEach-Object { Join-Path $payload $_ }) -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $zip).Length
          $manifestPath = Join-Path $output 'portable-update.json'
          $manifest = [ordered]@{
            schema = 1
            version = $version
            published_at = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            notes = "Metaplasia $version Development Portable. See the GitHub pre-release notes for changes."
            package = [ordered]@{
              url = "https://github.com/mkkima/Metaplasia/releases/download/$tag/$zipName"
              sha256 = $hash
              size = $size
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 4 -Compress
          [IO.File]::WriteAllText($manifestPath, $json, [Text.UTF8Encoding]::new($false))
          $signaturePath = Join-Path $output 'portable-update.json.sig'
          & '${{ steps.tools.outputs.openssl }}' pkeyutl -sign -rawin -inkey '${{ steps.tools.outputs.private_key }}' -in $manifestPath -out $signaturePath
          if ($LASTEXITCODE -ne 0) { throw 'Development update manifest signing failed.' }
          & '${{ steps.tools.outputs.openssl }}' pkeyutl -verify -pubin -inkey '${{ steps.tools.outputs.public_der }}' -keyform DER -rawin -in $manifestPath -sigfile $signaturePath
          if ($LASTEXITCODE -ne 0) { throw 'Development update manifest signature verification failed.' }
          "$hash  $zipName" | Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS.txt') -Encoding ascii -NoNewline
          "directory=$output" >> $env:GITHUB_OUTPUT

      - name: Remove private development signing material
        if: always()
        shell: pwsh
        run: |
          foreach ($path in @(
            '${{ steps.tools.outputs.private_key }}',
            '${{ steps.tools.outputs.public_der }}'
          )) {
            if ($path -and (Test-Path -LiteralPath $path -PathType Leaf)) {
              Remove-Item -LiteralPath $path -Force
            }
          }

      - name: Publish development portable pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = '${{ steps.assets.outputs.directory }}'
          gh release create '${{ steps.version.outputs.tag }}' `
            (Join-Path $assets "Metaplasia-${{ steps.version.outputs.version }}-windows-x64-portable-dev.zip") `
            (Join-Path $assets 'portable-update.json') `
            (Join-Path $assets 'portable-update.json.sig') `
            (Join-Path $assets 'SHA256SUMS.txt') `
            --verify-tag `
            --prerelease `
            --title "Metaplasia ${{ steps.version.outputs.version }} Development Portable" `
            --notes "Unsigned Debug portable build for development and personal testing. Its package metadata is signed by the isolated development update key and is served to development portable copies through automatic or manual update checks. Stable v* releases remain isolated and fail-closed until production signing is configured."

      - name: Advance signed development update channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = '${{ steps.assets.outputs.directory }}'
          gh release view development *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create development `
              --target '${{ github.sha }}' `
              --prerelease `
              --title 'Metaplasia Development Update Channel' `
              --notes 'Machine-readable signed metadata for development portable updates. Download versioned builds from their dev-v* pre-release pages.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the development update channel release.' }
          }
          gh release upload development (Join-Path $assets 'portable-update.json.sig') --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the development update signature.' }
          gh release upload development (Join-Path $assets 'portable-update.json') --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the development update manifest.' }
