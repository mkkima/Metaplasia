name: Release development portable build

on:
  push:
    tags:
      - "dev-v*"

permissions:
  contents: write

concurrency:
  group: development-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, test, and publish development portable
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate development tag and project versions
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^dev-v(?<version>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))$') {
            throw 'Development release tags must use dev-vMAJOR.MINOR.PATCH.'
          }
          $version = $Matches.version
          $cmake = Get-Content -Raw 'CMakeLists.txt'
          if ($cmake -notmatch 'project\(Metaplasia VERSION (?<version>[0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Could not read the CMake project version.'
          }
          $cmakeVersion = $Matches.version
          $cargoLine = Select-String -Path 'src-tauri/Cargo.toml' -Pattern '^version = "([0-9]+\.[0-9]+\.[0-9]+)"$' | Select-Object -First 1
          if (-not $cargoLine) { throw 'Could not read the Cargo package version.' }
          $cargoVersion = $cargoLine.Matches[0].Groups[1].Value
          $tauriVersion = (Get-Content -Raw 'src-tauri/tauri.conf.json' | ConvertFrom-Json).version
          foreach ($candidate in @($cmakeVersion, $cargoVersion, $tauriVersion)) {
            if ($candidate -ne $version) {
              throw "Tag $tag does not match every project version (CMake=$cmakeVersion, Cargo=$cargoVersion, Tauri=$tauriVersion)."
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Configure, build, and test Debug portable application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw 'vswhere.exe was not found on the GitHub runner.'
          }
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'A supported MSVC toolchain was not found.' }
          $devShell = Join-Path $installation 'Common7\Tools\Launch-VsDevShell.ps1'
          if (-not (Test-Path -LiteralPath $devShell -PathType Leaf)) {
            throw 'The Visual Studio developer shell was not found.'
          }
          & $devShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake --preset windows-msvc-debug
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed.' }
          cmake --build --preset windows-msvc-debug
          if ($LASTEXITCODE -ne 0) { throw 'Debug build failed.' }
          ctest --preset windows-msvc-debug
          if ($LASTEXITCODE -ne 0) { throw 'Debug tests failed.' }

      - name: Create development portable archive
        id: assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $output = Join-Path $PWD 'release-assets'
          $payload = Join-Path $env:RUNNER_TEMP 'metaplasia-development-portable'
          New-Item -ItemType Directory -Path $output, $payload | Out-Null
          $names = @(
            'metaplasia.exe',
            'metaplasia-host.exe',
            'metaplasia-watchdog.exe',
            'metaplasia-cli.exe',
            'metaplasia-agent.dll'
          )
          foreach ($name in $names) {
            $source = Join-Path 'build/debug/bin' $name
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Missing development component: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $payload $name)
          }
          $zipName = "Metaplasia-$version-windows-x64-portable-dev.zip"
          $zip = Join-Path $output $zipName
          Compress-Archive -LiteralPath ($names | ForEach-Object { Join-Path $payload $_ }) -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS.txt') -Encoding ascii -NoNewline
          "directory=$output" >> $env:GITHUB_OUTPUT

      - name: Publish development portable pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = '${{ steps.assets.outputs.directory }}'
          gh release create '${{ steps.version.outputs.tag }}' `
            (Join-Path $assets "Metaplasia-${{ steps.version.outputs.version }}-windows-x64-portable-dev.zip") `
            (Join-Path $assets 'SHA256SUMS.txt') `
            --verify-tag `
            --prerelease `
            --title "Metaplasia ${{ steps.version.outputs.version }} Development Portable" `
            --notes "Unsigned Debug portable build for development and personal testing. This pre-release is not served by the automatic update channel. Stable v* releases remain fail-closed until the repository signing keys and Authenticode certificate are configured."
