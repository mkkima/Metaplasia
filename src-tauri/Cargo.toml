[package]
name = "metaplasia-ui"
version = "0.1.0"
description = "Local control center for Metaplasia"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "metaplasia"
path = "src/main.rs"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.11.5" }

